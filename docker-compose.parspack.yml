services:
  eloria:
    image: eloria:release
    env_file: .env
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - eloria-internal

  operations:
    profiles: [operations]
    build:
      context: .
      target: operations
    env_file: .env
    environment:
      ELORIA_OPERATIONS_STATE_DIR: /var/lib/eloria/operations
      ELORIA_BACKUP_DIR: /var/lib/eloria/backups
    restart: unless-stopped
    volumes:
      - operations-state:/var/lib/eloria/operations
      - database-backups:/var/lib/eloria/backups
    networks:
      - eloria-internal

  caddy:
    image: caddy:2.10-alpine
    env_file: .env
    restart: unless-stopped
    depends_on:
      - eloria
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - eloria-internal

networks:
  eloria-internal:

volumes:
  caddy-data:
  caddy-config:
  operations-state:
  database-backups:
