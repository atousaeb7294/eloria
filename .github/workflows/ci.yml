name: ELORIA Release Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master, fix/production-readiness]

permissions:
  contents: read

concurrency:
  group: eloria-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eloria
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d eloria"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      NODE_ENV: test
      CI: "true"

      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eloria
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/eloria
      DATABASE_SSL_MODE: disable
      DATABASE_POOL_MAX: "5"
      DATABASE_STATEMENT_TIMEOUT_MS: "15000"

      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

      ELORIA_COMMERCE_ENABLED: "false"
      ELORIA_CUSTOMER_AUTH_ENABLED: "false"
      ELORIA_DYNAMIC_PRICING_ENABLED: "false"
      ELORIA_PAYMENT_ENABLED: "false"
      ELORIA_SUPPORT_ENABLED: "false"
      ELORIA_LEGAL_PAGES_INDEX: "false"
      ELORIA_SUPPORT_TURNSTILE_REQUIRED: "false"
      ELORIA_CONTENT_AUTOPILOT_ENABLED: "true"
      ELORIA_CONTENT_AUTOPILOT_DAILY_LIMIT: "1"

      ELORIA_ADMIN_USERNAME: admin
      ELORIA_ADMIN_PASSWORD: CI-only-password-123456789
      ELORIA_ADMIN_SESSION_VERSION: "1"
      ELORIA_ADMIN_SESSION_SECRET: ci-admin-session-secret-ci-admin-session-secret-ci-0001
      ELORIA_ADMIN_TOTP_SECRET: JBSWY3DPEHPK3PXP

      ELORIA_CUSTOMER_AUTH_SECRET: ci-customer-auth-secret-ci-customer-auth-secret-0002
      ELORIA_PAYMENT_START_SECRET: ci-payment-start-secret-ci-payment-start-secret-0003
      ELORIA_TRACKING_SECRET: ci-tracking-secret-ci-tracking-secret-ci-0004
      ELORIA_PAYMENT_RECEIPT_SECRET: ci-receipt-secret-ci-receipt-secret-ci-0005
      CRON_SECRET: ci-cron-secret-ci-cron-secret-ci-cron-secret-0006
      ELORIA_HEALTH_SECRET: ci-health-secret-ci-health-secret-ci-health-0007

      ELORIA_TRUST_PROXY: "false"
      ELORIA_PROXY_PROVIDER: "none"
      ELORIA_RATE_LIMIT_FAILURE_MODE: closed

      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ELORIA_DEPLOYMENT_ID: ci-${{ github.run_id }}

      ELORIA_SHIPPING_FLAT_TOMAN: "0"
      ELORIA_FREE_SHIPPING_FROM_TOMAN: "0"

      BRS_API_KEY: ci-brs-api-key
      ELORIA_GOLD_RATE_MIN_TOMAN: "1000000"
      ELORIA_GOLD_RATE_MAX_TOMAN: "1000000000"
      ELORIA_SILVER_RATE_MIN_TOMAN: "1000"
      ELORIA_SILVER_RATE_MAX_TOMAN: "10000000"
      ELORIA_GOLD_RATE_MAX_DEVIATION_PERCENT: "12"
      ELORIA_SILVER_RATE_MAX_DEVIATION_PERCENT: "20"

      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key-ci-service-role-key-ci-service-role-key
      ELORIA_STORAGE_BUCKET: product-images

      ELORIA_SECURITY_ALERT_WEBHOOK_URL: https://alerts.invalid/eloria-ci
      ELORIA_SUPPORT_WEBHOOK_URL: https://support.invalid/eloria-ci
      ELORIA_SECURITY_ALERT_MIN_SEVERITY: HIGH
      ELORIA_SECURITY_ALERT_COOLDOWN_SECONDS: "300"

      ELORIA_OTP_RETENTION_DAYS: "7"
      ELORIA_SESSION_RETENTION_DAYS: "30"
      ELORIA_SECURITY_ALERT_RETENTION_DAYS: "90"
      ELORIA_SECURITY_EVENT_RETENTION_DAYS: "180"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Enforce supply-chain policy
        run: npm run test:supply-chain

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to a fresh database
        run: npx prisma migrate deploy

      - name: Verify migration history
        run: npx prisma migrate status

      - name: Seed deterministic test data
        run: npm run db:seed

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test signed tokens
        run: npm run test:tokens

      - name: Test pricing engine and anomaly circuit breaker
        run: npm run test:pricing

      - name: Test commerce database invariants
        run: npm run test:commerce

      - name: Test Zarinpal payment simulation
        run: npm run test:payments

      - name: Test admin production hardening
        run: npm run test:admin-hardening

      - name: Test customer account behavior
        run: npm run test:customer

      - name: Test shipping rules
        run: npm run test:shipping

      - name: Test security alert outbox
        run: npm run test:security-alerts

      - name: Test hardening regression contracts
        run: npm run test:hardening

      - name: Test autopilot contracts
        run: npm run test:autopilot

      - name: Re-seed storefront fixtures
        run: npm run db:seed

      - name: Validate full production environment contract
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: https://ci.eloria.invalid
          DATABASE_SSL_MODE: verify-full
          ELORIA_COMMERCE_ENABLED: "true"
          ELORIA_CUSTOMER_AUTH_ENABLED: "true"
          ELORIA_DYNAMIC_PRICING_ENABLED: "true"
          ELORIA_PAYMENT_ENABLED: "true"
          ELORIA_SUPPORT_ENABLED: "true"
          ELORIA_MEASUREMENT_ENABLED: "true"
          ELORIA_CUSTOMER_WATCHES_ENABLED: "true"
          ELORIA_MEASUREMENT_RETENTION_DAYS: 90
          ELORIA_SUPPORT_TURNSTILE_REQUIRED: "true"
          ELORIA_TRUST_PROXY: "true"
          ELORIA_PROXY_PROVIDER: generic
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          KAVENEGAR_API_KEY: ci-kavenegar-api-key-1234567890
          ZARINPAL_MERCHANT_ID: 00000000-0000-0000-0000-000000000000
          ELORIA_LEGAL_SELLER_NAME: "ELORIA CI Seller"
          ELORIA_LEGAL_BUSINESS_ADDRESS: "CI-only automated test address"
          ELORIA_LEGAL_SUPPORT_EMAIL: "ci@eloria.invalid"
        run: npm run check:env

      - name: Static security audit
        run: npm run audit:security

      - name: Professional quality audit
        run: npm run audit:quality

      - name: Dependency security audit
        run: npm run audit:dependencies

      - name: Build production application against CI database
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: https://ci.eloria.invalid
          ELORIA_CI_BUILD_ENV_ASSERTED: "true"
        run: npm run build

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium webkit

      - name: Install Playwright Chromium and WebKit
        run: npx playwright install chromium webkit

      - name: Run browser tests
        run: npm run test:e2e

      - name: Build production container
        env:
          NEXT_PUBLIC_SITE_URL: https://ci.eloria.invalid
        run: |
          docker build \
            --network=host \
            --build-arg NEXT_PUBLIC_SITE_URL="${NEXT_PUBLIC_SITE_URL}" \
            --build-arg DATABASE_SSL_MODE=disable \
            --secret id=DATABASE_URL,env=DATABASE_URL \
            --secret id=DIRECT_URL,env=DIRECT_URL \
            --target runner \
            -t eloria-ci:${{ github.sha }} \
            .

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
