name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eloria
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eloria
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/eloria
      ELORIA_ADMIN_USERNAME: admin
      ELORIA_ADMIN_PASSWORD: CI-only-password-1234
      ELORIA_ADMIN_SESSION_VERSION: "1"
      ELORIA_ADMIN_SESSION_SECRET: ci-session-secret-ci-session-secret-ci-session-secret
      CRON_SECRET: ci-cron-secret-ci-cron-secret-ci-cron-secret-ci
      ELORIA_TRACKING_SECRET: ci-tracking-secret-ci-tracking-secret-ci
      ELORIA_PAYMENT_RECEIPT_SECRET: ci-receipt-secret-ci-receipt-secret-ci
      ELORIA_TRUST_PROXY: "true"
      DATABASE_SSL_MODE: disable
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ELORIA_DEPLOYMENT_ID: ci-build
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Prepare test database
        run: npx prisma db push
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
